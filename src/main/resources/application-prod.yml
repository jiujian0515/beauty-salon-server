# ============================================================
# 生产环境配置：敏感信息（数据库账号密码等）通过环境变量注入，绝不写死在代码里
# 语法 ${DB_HOST:mysql} 表示：优先读环境变量 DB_HOST，读不到则用默认值 mysql
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:beauty_salon}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080
